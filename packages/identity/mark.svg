<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="coraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0D0E15" />
  <g filter="url(#glow)">
    <!-- Terminal Bracket Geometry -->
    <path d="M 180 140 L 140 180 L 140 236 L 116 256 L 140 276 L 140 332 L 180 372" 
          fill="none" stroke="url(#coraGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Stylized Neural C Shape -->
    <path d="M 350 160 Q 240 130 220 256 Q 240 382 350 352" 
          fill="none" stroke="url(#coraGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Neural Network Nodes -->
    <circle cx="220" cy="256" r="18" fill="url(#coraGrad)" />
    <circle cx="280" cy="200" r="14" fill="url(#coraGrad)" />
    <circle cx="280" cy="312" r="14" fill="url(#coraGrad)" />
    <circle cx="330" cy="170" r="12" fill="url(#coraGrad)" />
    <circle cx="330" cy="342" r="12" fill="url(#coraGrad)" />
    <!-- Connections -->
    <line x1="220" y1="256" x2="280" y2="200" stroke="url(#coraGrad)" stroke-width="6" opacity="0.8" />
    <line x1="220" y1="256" x2="280" y2="312" stroke="url(#coraGrad)" stroke-width="6" opacity="0.8" />
    <line x1="280" y1="200" x2="330" y2="170" stroke="url(#coraGrad)" stroke-width="6" opacity="0.8" />
    <line x1="280" y1="312" x2="330" y2="342" stroke="url(#coraGrad)" stroke-width="6" opacity="0.8" />
    <line x1="280" y1="200" x2="280" y2="312" stroke="url(#coraGrad)" stroke-width="4" opacity="0.5" />
  </g>
</svg>
